<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHARACTER ROULETTE</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- 左右のティーパーティー装飾 -->
    <div class="side-decoration left">
      🌹
      <br>
      🫖
      <br>
      🧁
      <br>
      🌹
    </div>

    <div class="side-decoration right">
      🌹
      <br>
      🫖
      <br>
      🍰
      <br>
      🌹
    </div>


    <!-- タイトル -->
    <section class="title-frame">

      <div class="ribbon">
        🎀
      </div>

      <div class="crown">
        ♕
      </div>

      <h1>
        CHARACTER
      </h1>

      <h2>
        ROULETTE
      </h2>

      <div class="title-line">
        ♡ ───────── ♡
      </div>

      <p>
        ✧ キャラクターの設定をランダムに決めよう！ ✧
      </p>

    </section>


    <!-- ルーレットボタン -->
    <section class="roulette-area">

      <div class="lace-top">
        ♡ ｡･ﾟﾟ･｡ ♡ ｡･ﾟﾟ･｡ ♡
      </div>

      <button id="rouletteButton">

        <span class="dice">
          🎲
        </span>

        <span>
          ルーレットを回す！
        </span>

        <span class="arrow">
          ➜
        </span>

      </button>

      <div class="lace-bottom">
        ♡ ｡･ﾟﾟ･｡ ♡ ｡･ﾟﾟ･｡ ♡
      </div>

    </section>


    <!-- 使い方 -->
    <section class="how-to">

      <div class="section-title">
        ♡　使い方　♡
      </div>

      <div class="how-line">
        <span>1</span>
        「ルーレットを回す！」ボタンを押す
      </div>

      <div class="how-line">
        <span>2</span>
        キャラクターの設定がランダムで決まります
      </div>

      <div class="how-line">
        <span>3</span>
        気に入らない場合は、もう一度回してみてね♡
      </div>

      <div class="bow">
        ୨୧
      </div>

    </section>


    <!-- 結果 -->
    <section id="result">

      <div class="result-title">
        ♡ CHARACTER ♡
      </div>

      <p class="hint">
        ルーレットを回してね ✧
      </p>

    </section>


    <!-- 下の飾り -->
    <div class="bottom-decoration">
      🌹　♡　🫖　♡　🍰　♡　🌹
    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
